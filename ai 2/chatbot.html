<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot Access Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #f3f6fb;
      }
      .chat-box {
        max-width: 700px;
        margin: 60px auto;
        background: white;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .chat-header {
        background: linear-gradient(135deg, #0d6efd, #4f46e5);
        color: white;
        padding: 18px 20px;
      }
      .chat-body {
        height: 320px;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
      }
      .chat-footer {
        padding: 15px 20px;
        border-top: 1px solid #e5e7eb;
        background: white;
      }
      .role-toggle .btn {
        min-width: 140px;
      }
    </style>
  </head>
  <body>
    <div class="chat-box">
      <div class="chat-header">
        <h4 class="mb-0">AI Chatbot</h4>
      </div>

      <div class="p-3 border-bottom bg-white role-toggle">
        <div class="btn-group w-100" role="group" aria-label="Role switcher">
          <button type="button" class="btn btn-outline-primary active" data-role="admin">Admin Access</button>
          <button type="button" class="btn btn-outline-secondary" data-role="user">User Access</button>
        </div>
      </div>

      <div class="chat-body" id="chatMessages">
        <div class="text-muted">Chat messages will appear here.</div>
      </div>

      <div class="chat-footer">
        <div id="statusBox" class="alert alert-danger mt-0 mb-3">Access Denied: You do not have admin permissions to use the chatbot.</div>
        <div class="input-group">
          <input id="messageInput" class="form-control" type="text" placeholder="Type your message..." disabled />
          <button id="sendMessage" class="btn btn-primary" type="button" disabled>Send</button>
        </div>
      </div>
    </div>

    <script src="chatbot.js"></script>
  </body>
</html>
